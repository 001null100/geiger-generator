name: Materialize initial source
on:
  push:
    paths: [.github/workflows/materialize-initial-source.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Commit assembled source without overwriting intervening work
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['REPOSITORY']
          expected = os.environ['EXPECTED_HEAD']
          assembled = '35d21587522d479d902830e815b1a0062fe27f4c'
          def api(path, payload=None):
              args = ['gh', 'api', f'repos/{repo}/{path}']
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          head = api('git/ref/heads/main')['object']['sha']
          if head != expected:
              raise RuntimeError('main moved; refusing to replace intervening work')
          current = api(f'git/trees/{head}?recursive=1')
          source = api(f'git/trees/{assembled}?recursive=1')
          if current.get('truncated') or source.get('truncated'):
              raise RuntimeError('Incomplete tree response')
          source_paths = {x['path']: x for x in source['tree'] if x['type'] != 'tree'}
          allowed_existing = {'AGENTS.md', '.github/workflows/dependency-sources.yml', '.github/workflows/materialize-initial-source.yml'}
          for entry in current['tree']:
              if entry['type'] == 'tree' or entry['path'] in allowed_existing:
                  continue
              old = source_paths.get(entry['path'])
              if old is None or old['sha'] != entry['sha']:
                  raise RuntimeError('Unrecognized work exists on main: ' + entry['path'])
          # Keep this recovery workflow in the new tree so its run remains inspectable.
          extra = next(x for x in current['tree'] if x['path'] == '.github/workflows/materialize-initial-source.yml')
          tree = api('git/trees', {'base_tree': assembled, 'tree': [{'path': extra['path'], 'mode': extra['mode'], 'type': 'blob', 'sha': extra['sha']}]})['sha']
          commit = api('git/commits', {'message': 'Implement Geiger Generator: detector DSP, 37 controls, native UI and release tests', 'tree': tree, 'parents': [head]})['sha']
          subprocess.run(['gh', 'api', '--method', 'PATCH', f'repos/{repo}/git/refs/heads/main', '-f', 'sha=' + commit, '-F', 'force=false'], check=True)
          # Token-originated pushes do not trigger push workflows; dispatch explicitly.
          subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{repo}/actions/workflows/build-release.yml/dispatches', '-f', 'ref=main'], check=True)
          print('Committed assembled implementation:', commit)
          print('Dispatched Windows/Linux build, test, validator and conditional release workflow.')
          PY
