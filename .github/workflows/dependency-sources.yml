name: Dependency sources
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/dependency-sources.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Bundle project and validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/project offline/validator offline/licences
          git archive HEAD | tar -x -C offline/project
          git rev-parse HEAD > offline/SOURCE_COMMIT.txt
          curl -fL --retry 3 https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip -o validator.zip
          unzip -q validator.zip -d validator-package
          tar -xzf "$(find validator-package -name '*.tar.gz' | head -n 1)" -C offline/validator
          cp licences/AGPL-3.0.txt offline/licences/AGPL-3.0.txt
      - uses: actions/upload-artifact@v6
        with:
          name: offline-validation-tools
          path: offline
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Bundle native Linux build support
        shell: bash
        run: |
          set -euo pipefail
          bash tools/install-linux-deps.sh
          mkdir -p support
          tar -czhf support/linux-build-support.tar.gz -C / usr/include/X11 usr/include/GL usr/include/freetype2 usr/include/fontconfig usr/include/png.h usr/include/pngconf.h usr/include/pnglibconf.h usr/lib/x86_64-linux-gnu/pkgconfig/freetype2.pc usr/lib/x86_64-linux-gnu/pkgconfig/fontconfig.pc usr/lib/x86_64-linux-gnu/pkgconfig/libpng16.pc usr/lib/x86_64-linux-gnu/libfreetype.so usr/lib/x86_64-linux-gnu/libfontconfig.so
      - uses: actions/upload-artifact@v6
        with:
          name: offline-linux-build-support
          path: support
          retention-days: 7
          if-no-files-found: error
      - name: Fetch pinned source dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir dependencies
          git clone https://github.com/001null100/null-clap.git dependencies/null_clap
          git -C dependencies/null_clap checkout 8612a19fbe7fbe81b249c22e1593da18bb998b97
          git clone https://github.com/free-audio/clap.git dependencies/clap
          git -C dependencies/clap checkout a47f6badb49d948fd009998f28309cdab78979c9
          git clone https://github.com/free-audio/clap-helpers.git dependencies/clap_helpers
          git -C dependencies/clap_helpers checkout c35dd4906bd8efbb900cb2b89e680fed463cc8b1
          git clone --depth 1 --branch 9.0.0 https://github.com/juce-framework/JUCE.git dependencies/juce
          find dependencies -type d -name .git -prune -exec rm -rf '{}' +
      - uses: actions/upload-artifact@v6
        with:
          name: pinned-dependency-sources
          path: dependencies
          retention-days: 7
          if-no-files-found: error
